<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hardware Store{% endblock %}</title>
    <style>
        :root { --fondo: #0f1419; --panel: #1a2129; --borde: #2a3440; --texto: #e6edf3;
                --suave: #8b98a5; --acento: #2f9e8f; --peligro: #d9534f;
                --lado: max(32px, calc((100vw - 1100px) / 2 + 32px)); /* alinea header y nav con main */ }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
               background: var(--fondo); color: var(--texto); line-height: 1.5;
               min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; width: 100%; }
        header { background: linear-gradient(135deg, #16323a, #0f1419); padding: 24px var(--lado);
                 border-bottom: 1px solid var(--borde); }
        header h1 { margin: 0; font-size: 1.8rem; letter-spacing: .5px; }
        nav { display: flex; gap: 8px; padding: 12px calc(var(--lado) - 14px); background: var(--panel);
              border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
        nav a { color: var(--texto); text-decoration: none; padding: 6px 14px; border-radius: 6px;
                transition: background-color .15s ease; }
        nav a:hover { background: var(--borde); }
        nav a[aria-current="page"] { background: var(--borde); color: #fff; font-weight: 600;
                                     box-shadow: inset 0 -2px 0 var(--acento); }
        main { max-width: 1100px; margin: 0 auto; padding: 24px 32px; }
        main h2 { margin-top: 0; }
        main a { color: var(--acento); transition: color .15s ease; }
        /* solo la lista principal es grilla; las listas internas (productos de un pedido) no */
        main > ul { list-style: none; padding: 0; display: grid; gap: 14px;
                    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        main > ul:has(li ul) { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        main > ul > li { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px;
                         padding: 16px; overflow: hidden; animation: aparece .35s ease both;
                         transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
        main > ul > li:hover { transform: translateY(-3px); border-color: var(--acento);
                               box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
        main > ul > li:has(.acciones) { display: flex; flex-direction: column; }
        main li ul { margin: 6px 0 0; padding-left: 18px; color: var(--suave); }
        main li img { display: block; width: calc(100% + 32px); margin: -16px -16px 14px;
                      aspect-ratio: 4 / 3; object-fit: contain; background: #fff; }
        main li strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
        main li span { display: block; color: var(--suave); font-size: .9rem; margin-bottom: 10px; }
        main li .precio { color: var(--texto); font-size: 1.15rem; font-weight: 600; margin-bottom: 2px; }
        main li .agotado { color: var(--peligro); }
        .acciones { margin-top: auto; display: flex; gap: 14px; font-size: .9rem; }
        main li a[href*="eliminar"] { color: var(--peligro); }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; max-width: 520px;
             background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 16px 20px; }
        dt { color: var(--suave); }
        dd { margin: 0; }
        form { max-width: 560px; }
        form p { display: flex; flex-direction: column; gap: 4px; }
        form button + a { margin-left: 14px; }
        input, textarea, select { background: var(--panel); color: var(--texto); font: inherit;
                                  border: 1px solid var(--borde); border-radius: 6px; padding: 8px;
                                  transition: border-color .15s ease; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--acento); }
        button, input[type="submit"] { background: var(--acento); color: #fff; border: 0; font: inherit;
                                       border-radius: 6px; padding: 8px 16px; cursor: pointer;
                                       transition: filter .15s ease, transform .1s ease; }
        button:hover { filter: brightness(1.12); }
        button:active { transform: scale(.97); }
        .portada { padding: 36px 32px; border-radius: 12px; border: 1px solid var(--borde); margin-bottom: 18px;
                   background: radial-gradient(circle at 85% 20%, rgba(47, 158, 143, .25), transparent 55%), var(--panel);
                   animation: aparece .35s ease both; }
        .portada h2 { font-size: 2rem; margin-bottom: 8px; }
        .portada p { color: var(--suave); max-width: 560px; margin: 0 0 20px; }
        .boton { display: inline-block; background: var(--acento); color: #fff !important; text-decoration: none;
                 padding: 10px 20px; border-radius: 6px; font-weight: 600; transition: filter .15s ease; }
        .boton:hover { filter: brightness(1.12); }
        .accesos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 28px; }
        .accesos a { display: block; padding: 16px; border-radius: 10px; text-decoration: none;
                     background: var(--panel); border: 1px solid var(--borde); color: var(--texto);
                     animation: aparece .35s ease both;
                     transition: transform .18s ease, border-color .18s ease; }
        .accesos a:hover { transform: translateY(-3px); border-color: var(--acento); }
        .accesos strong { display: block; color: var(--acento); }
        .accesos span { color: var(--suave); font-size: .9rem; }
        @keyframes aparece { from { opacity: 0; transform: translateY(8px); } }
        @media (max-width: 600px) { nav a { padding: 6px 10px; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        footer { text-align: center; color: var(--suave); padding: 24px;
                 border-top: 1px solid var(--borde); margin-top: 32px; }
    </style>
</head>
<body>
    <header>
        <h1>Hardware Store</h1>
    </header>

    <nav>
        <a href="{% url 'inicio' %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="{% url 'catalogo' %}" {% if '/productos/' in request.path %}aria-current="page"{% endif %}>Catálogo</a>
        <a href="{% url 'pedidos' %}" {% if '/pedidos/' in request.path %}aria-current="page"{% endif %}>Pedidos</a>
        <a href="{% url 'usuarios_lista' %}" {% if '/usuarios/' in request.path %}aria-current="page"{% endif %}>Vendedores</a>

    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Hardware Store</p>
    </footer>
</body>
</html>
