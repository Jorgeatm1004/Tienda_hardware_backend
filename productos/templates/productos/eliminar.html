{% extends 'core/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
    <h2>{{ titulo }}</h2>
    <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'catalogo' %}">Cancelar</a>
    </form>
{% endblock %}
