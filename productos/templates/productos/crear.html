{% extends 'core/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
    <h2>{{ titulo }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar producto</button>
        <a href="{% url 'catalogo' %}">Cancelar</a>
    </form>
{% endblock %}
